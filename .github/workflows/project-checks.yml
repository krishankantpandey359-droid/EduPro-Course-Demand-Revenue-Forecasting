name: EduPro project checks

on:
  push:
    branches: ["main", "audit-fix/edupro-readme-conflict", "security/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run data pipeline tests
        run: pytest -q
      - name: Run chronological backtest on bundled EduPro data
        run: python scripts/run_chronological_backtest.py --test-months 3
      - name: Upload chronological backtest report
        uses: actions/upload-artifact@v4
        with:
          name: edupro-chronological-backtest
          path: |
            outputs/chronological_backtest.csv
            outputs/chronological_backtest.json
          if-no-files-found: error
          retention-days: 14
      - name: Start Streamlit and check HTTP response
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/ > /dev/null; then
              echo "Streamlit app responded successfully."
              exit 0
            fi
            sleep 2
          done
          cat streamlit.log
          exit 1
